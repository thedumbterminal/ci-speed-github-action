name: ci-speed
author: thedumbterminal
description: Upload test results to CI-Speed
branding:
  icon: 'fast-forward'
  color: 'blue'
inputs:
  token:
    description: 'API authentication token'
    required: true
  results:
    description: 'XML results files to upload'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set GitHub Path
      run: echo "$GITHUB_ACTION_PATH" >> $GITHUB_PATH
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: Start
      run: |
        upload_to_ci_speed.sh start "${{ github.repository }}" "${{ github.run_id }}" "${{ github.sha }}"
      shell: bash
      env:
        CI_SPEED_AUTH_TOKEN: ${{ inputs.token }}
    - name: Upload
      run: |
        upload_to_ci_speed.sh upload "${{ github.repository }}" "${{ github.run_id }}" "${{ github.sha }}" "${{ inputs.results }}"
      shell: bash
      env:
        CI_SPEED_AUTH_TOKEN: ${{ inputs.token }}
    - name: Finish
      run: |
        upload_to_ci_speed.sh finish "${{ github.repository }}" "${{ github.run_id }}" "${{ github.sha }}"
      shell: bash
      env:
        CI_SPEED_AUTH_TOKEN: ${{ inputs.token }}
